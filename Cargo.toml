[package]
name = "habit-tracker"
version = "0.1.0"
edition = "2021"

[lib]
name = "habit_tracker"
path = "src/lib.rs"

[[bin]]
name = "habit-tracker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
